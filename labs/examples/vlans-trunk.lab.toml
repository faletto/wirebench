format  = "labsim-lab"
version = 1

[meta]
title  = "Two VLANs across a trunk"
author = "wirebench"
seed   = 1

[[device]]
name     = "sw1"
template = "switch-l2-8"
pos      = [220, 150]
startup_config = """
hostname sw1
!
vlan 10
 name sales
!
vlan 20
 name eng
!
interface FastEthernet0/1
 switchport access vlan 10
!
interface FastEthernet0/2
 switchport access vlan 20
!
interface FastEthernet0/8
 switchport mode trunk
"""

[[device]]
name     = "sw2"
template = "switch-l2-8"
pos      = [460, 150]
startup_config = """
hostname sw2
!
vlan 10
 name sales
!
vlan 20
 name eng
!
interface FastEthernet0/1
 switchport access vlan 10
!
interface FastEthernet0/2
 switchport access vlan 20
!
interface FastEthernet0/8
 switchport mode trunk
"""

[[device]]
name     = "pc1"
template = "host-pc"
pos      = [40, 70]
[device.host]
ipv4 = "10.0.10.1/24"

[[device]]
name     = "pc3"
template = "host-pc"
pos      = [40, 230]
[device.host]
ipv4 = "10.0.20.3/24"

[[device]]
name     = "pc2"
template = "host-pc"
pos      = [640, 70]
[device.host]
ipv4 = "10.0.10.2/24"

[[device]]
name     = "pc4"
template = "host-pc"
pos      = [640, 230]
[device.host]
ipv4 = "10.0.20.4/24"

[[link]]
a = "pc1:eth0"
b = "sw1:Fa0/1"

[[link]]
a = "pc3:eth0"
b = "sw1:Fa0/2"

[[link]]
a = "sw1:Fa0/8"
b = "sw2:Fa0/8"

[[link]]
a = "pc2:eth0"
b = "sw2:Fa0/1"

[[link]]
a = "pc4:eth0"
b = "sw2:Fa0/2"

[[annotation]]
text = "VLAN 10 (sales): pc1, pc2 · VLAN 20 (eng): pc3, pc4"
pos  = [180, 20]

[[annotation]]
text = "Try: ping 10.0.10.2 from pc1, then ping 10.0.20.4 from pc1 (different VLAN)"
pos  = [120, 300]
