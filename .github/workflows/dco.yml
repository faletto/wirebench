name: dco

# Developer Certificate of Origin: every commit in a pull request must carry a
# `Signed-off-by: Name <email>` line (git commit -s). See CONTRIBUTING.md.
on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit needs a Signed-off-by line
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "origin/${BASE}..${HEAD}"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>'; then
              echo "::error::commit ${sha} has no Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
