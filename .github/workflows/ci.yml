name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Same scenario, same bytes: x86_64 Linux, aarch64 macOS and wasm32 must print the
  # exact line pinned in testkit/determinism.txt.
  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -q -p cli --release -- det | diff - testkit/determinism.txt

  determinism-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - run: cargo build -q -p cli --release --target wasm32-wasip1
      - run: wasmtime target/wasm32-wasip1/release/wirebench.wasm det | diff - testkit/determinism.txt

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p wire -p kernel -p netdev -p engine --target wasm32-unknown-unknown

  # The browser bundle. Uploaded so it can be downloaded and opened (or served) for manual checks.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: trunk build --release
        working-directory: crates/app
      - run: ls -l crates/app/dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: crates/app/dist

  # Short fuzz smoke run of every target (a longer run belongs in a scheduled job).
  # Each target also asserts parse -> emit -> parse round-trips, so this is a property test too.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run every target for 20 seconds
        run: |
          for t in wire_ethernet wire_arp wire_ipv4 wire_icmp shell_exec lab_load device_frames; do
            echo "::group::$t"
            # +nightly: rust-toolchain.toml pins stable. --target: the prebuilt cargo-fuzz
            # binary would otherwise default to a musl target that is not installed.
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=20
            echo "::endgroup::"
          done
      - name: Keep crash inputs if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
