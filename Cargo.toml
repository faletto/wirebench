[workspace]
resolver = "2"
members = ["crates/wire", "crates/kernel", "crates/netdev", "crates/engine", "crates/cli", "crates/clish", "crates/app", "crates/labfile"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.82"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
proptest = "1"
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }

[profile.release]
lto = "thin"
