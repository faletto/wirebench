[[device]]
name = "r2"
template = "router-2g"
pos = [360, 60]

[[link]]
a = "r1:Gi0/0"
b = "sw1:Fa0/1"

[[link]]
a = "r2:Gi0/0"
b = "sw1:Fa0/2"
