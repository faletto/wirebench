format = "labsim-lab"
version = 1

[meta]
title = "Router on a stick"

[[device]]
name = "pc1"
template = "host-pc"
pos = [0, 0]

[[device]]
name = "pc2"
template = "host-pc"
pos = [0, 120]

[[device]]
name = "sw1"
template = "switch-l2-8"
pos = [150, 60]

[[device]]
name = "r1"
template = "router-2g"
pos = [320, 60]

[[link]]
a = "pc1:eth0"
b = "sw1:Fa0/1"

[[link]]
a = "pc2:eth0"
b = "sw1:Fa0/2"

[[link]]
a = "sw1:Fa0/8"
b = "r1:Gi0/0"
