format = "labsim-lab"
version = 1

[meta]
title = "First hop redundancy: two routers share one gateway address"

[[device]]
name = "pc1"
template = "host-pc"
pos = [0, 60]

[[device]]
name = "sw1"
template = "switch-l2-8"
pos = [160, 60]

[[device]]
name = "r1"
template = "router-2g"
pos = [320, 0]

[[device]]
name = "r2"
template = "router-2g"
pos = [320, 140]

[[device]]
name = "sw2"
template = "switch-l2-8"
pos = [480, 60]

[[device]]
name = "srv"
template = "host-pc"
pos = [640, 60]

[[link]]
a = "pc1:eth0"
b = "sw1:Fa0/1"

[[link]]
a = "r1:Gi0/0"
b = "sw1:Fa0/2"

[[link]]
a = "r2:Gi0/0"
b = "sw1:Fa0/3"

[[link]]
a = "r1:Gi0/1"
b = "sw2:Fa0/2"

[[link]]
a = "r2:Gi0/1"
b = "sw2:Fa0/3"

[[link]]
a = "srv:eth0"
b = "sw2:Fa0/1"
