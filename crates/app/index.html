<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wirebench</title>
    <link data-trunk rel="rust" data-bin="wirebench-app" data-wasm-opt="z" />
    <style>
      html, body { margin: 0; height: 100%; background: #1b1b1b; color: #ccc; font-family: system-ui, sans-serif; }
      canvas { width: 100%; height: 100%; display: block; }
      #loading { position: absolute; inset: 0; display: grid; place-items: center; }
    </style>
  </head>
  <body>
    <canvas id="the_canvas_id"></canvas>
    <div id="loading">Loading wirebench…</div>
    <noscript>wirebench needs JavaScript and WebAssembly.</noscript>
  </body>
</html>
