[package]
name = "app"
description = "egui/eframe front end: native and web from one codebase"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "wirebench-app"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
engine = { path = "../engine" }
kernel = { path = "../kernel" }
wire = { path = "../wire" }
labfile = { path = "../labfile" }
egui = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "Performance", "console", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlInputElement", "HtmlElement", "Node", "FileList", "File", "FileReader", "Event", "EventTarget", "Storage", "KeyboardEvent", "BeforeUnloadEvent", "Worker", "WorkerOptions", "WorkerType", "WorkerGlobalScope", "MessageEvent", "Location"] }
